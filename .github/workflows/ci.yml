name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: App imports cleanly
        # Catches syntax errors, missing packages and bad imports without needing a database.
        env:
          JWT_SECRET_KEY: ci-only-secret-not-used-anywhere-else
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
        run: python -c "import app.main; print('app.main imported OK')"

      - name: Unit tests
        run: python -m pytest -v

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - name: Type check
        run: npm run typecheck

  docker:
    name: Build and push images
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    env:
      # Push only from the main branch; pull requests just prove the images build.
      PUSH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
      HUB_USER: ${{ secrets.DOCKERHUB_USERNAME || 'local' }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: ${{ env.PUSH == 'true' }}
          tags: |
            ${{ env.HUB_USER }}/cloudtrace-backend:latest
            ${{ env.HUB_USER }}/cloudtrace-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: ${{ env.PUSH == 'true' }}
          # NEXT_PUBLIC_* values are baked in at build time. Set the repository
          # variable NEXT_PUBLIC_API_URL to change it; the default suits local use.
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || 'http://localhost:8000' }}
          tags: |
            ${{ env.HUB_USER }}/cloudtrace-frontend:latest
            ${{ env.HUB_USER }}/cloudtrace-frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max
